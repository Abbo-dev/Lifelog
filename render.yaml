services:
  - type: web
    name: lifelog-billing-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4242
      - key: APP_URL
        sync: false
      - key: APP_URL_LOCAL
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_ID_MONTHLY
        sync: false
      - key: PADDLE_PRICE_ID_ANNUAL
        sync: false
      - key: PADDLE_API_BASE_URL
        value: https://api.paddle.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PADDLE_REQUEST_TIMEOUT_MS
        value: 10000
      - key: PADDLE_REQUEST_RETRIES
        value: 1
      - key: PADDLE_REQUEST_RETRY_DELAY_MS
        value: 300
      - key: PADDLE_EVENT_TTL_DAYS
        value: 30
      - key: CHECKOUT_RATE_WINDOW_MS
        value: 300000
      - key: CHECKOUT_RATE_MAX
        value: 15
      - key: PORTAL_RATE_WINDOW_MS
        value: 300000
      - key: PORTAL_RATE_MAX
        value: 20
      - key: WEBHOOK_RATE_WINDOW_MS
        value: 60000
      - key: WEBHOOK_RATE_MAX
        value: 200
      - key: RECURRING_NOTES_ENABLED
        value: "true"
      - key: RECURRING_CHECK_INTERVAL_MS
        value: 60000
      - key: RECURRING_BATCH_SIZE
        value: 50
      - key: RECURRING_MAX_PASSES
        value: 5
